name: Sync Scoop manifest

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to sync
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    concurrency:
      group: scoop-manifest
      cancel-in-progress: false
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download published Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vX.Y.Z release tag" >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" != "false" ]]; then
            echo "Scoop manifest requires a published stable release" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/scoop-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'sharer-windows-x86_64.zip' --dir "$RUNNER_TEMP/scoop-release"

      - name: Update and verify Scoop manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/update-scoop-manifest.py bucket/sharer.json "$RUNNER_TEMP/scoop-release/sharer-windows-x86_64.zip" "$RELEASE_TAG"

      - name: Commit manifest update
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- bucket/sharer.json; then
            echo "Scoop manifest is already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bucket/sharer.json
          git commit -m "chore: update Scoop manifest for $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
